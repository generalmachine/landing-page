<!DOCTYPE html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>General Machine Intelligence</title>
    <meta
      name="description"
      content="General Machine Intelligence Inc. is an AI lab. We build harnesses and infrastructure for agents."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f7f8" />
    <meta property="og:title" content="General Machine Intelligence" />
    <meta
      property="og:description"
      content="An AI lab. Harnesses and infrastructure for agents."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        var t = localStorage.getItem("theme") || "system";
        if (t !== "light" && t !== "dark" && t !== "system") t = "system";
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <pre><code><span class="header">GENERAL MACHINE INTELLIGENCE <span class="cursor" aria-hidden="true"></span>
2026</span>

General Machine Intelligence Inc. is an AI lab. We build harnesses and infrastructure for agents.

<span class="h2">WORK</span>

- Harnesses
- Infrastructure
- Applications
- Protocols

<span class="h2">CONTACT</span>

<a href="mailto:hello@generalmachine.ai">hello@generalmachine.ai</a>

© 2026 General Machine Intelligence Inc.

theme <button type="button" data-theme-set="light">light</button> <button type="button" data-theme-set="dark">dark</button> <button type="button" data-theme-set="system">system</button>
</code></pre>
    <script>
      (function () {
        var root = document.documentElement;
        var buttons = document.querySelectorAll("[data-theme-set]");
        var meta = document.querySelector('meta[name="theme-color"]');

        function scheme() {
          var t = root.getAttribute("data-theme") || "system";
          if (t === "system") {
            return window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          return t;
        }

        function paint() {
          var t = root.getAttribute("data-theme") || "system";
          for (var i = 0; i < buttons.length; i++) {
            buttons[i].setAttribute(
              "aria-pressed",
              buttons[i].getAttribute("data-theme-set") === t ? "true" : "false"
            );
          }
          if (meta) meta.setAttribute("content", scheme() === "dark" ? "#151516" : "#f7f7f8");
        }

        function setTheme(t) {
          root.setAttribute("data-theme", t);
          localStorage.setItem("theme", t);
          paint();
        }

        for (var i = 0; i < buttons.length; i++) {
          buttons[i].addEventListener("click", function (e) {
            setTheme(e.currentTarget.getAttribute("data-theme-set"));
          });
        }

        window
          .matchMedia("(prefers-color-scheme: dark)")
          .addEventListener("change", paint);

        paint();
      })();
    </script>
  </body>
</html>
